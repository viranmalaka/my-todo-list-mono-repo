
services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: todo-mongo
    restart: unless-stopped
    ports:
      - "27028:27017"       # host:container — MongoDB always listens on 27017 internally
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: todos
    networks:
      - todo-net

  # ── Express API ───────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: todo-server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/todos
      CLIENT_ORIGIN: http://localhost   # nginx serves the client on :80
    networks:
      - todo-net

  # ── React SPA (nginx) ─────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""   # empty → axios uses relative paths → nginx proxies /api/*
    container_name: todo-client
    restart: unless-stopped
    ports:
      - "80:80"             # ← the one public port
    depends_on:
      - server
    networks:
      - todo-net

networks:
  todo-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
